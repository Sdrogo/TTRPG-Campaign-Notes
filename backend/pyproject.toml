[project]
name = "ttrpg-campaign-notes-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pyjwt[crypto]>=2.9",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.13",
    "httpx>=0.27",
    "pillow>=11.3",
    "python-multipart>=0.0.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "mypy>=1.13",
    "ruff>=0.7",
]

[tool.mypy]
strict = true
python_version = "3.12"
enable_error_code = ["deprecated"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "D1"]
# D1 = every public module, class and function in app/ has a docstring
# (code-standards.md -> Documentation). `__init__` is covered by its class's
# docstring; tests and migrations are named for what they do instead.
ignore = ["D107"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D1"]
"migrations/**" = ["D1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
markers = [
    # Added automatically to any test using the `db_session` fixture
    # (tests/conftest.py). CI runs `-m "not integration"`, which needs no
    # database and therefore no secrets.
    "integration: needs the real Supabase database",
]

[tool.coverage.run]
# SQLAlchemy's asyncio layer runs database calls in greenlets. Without this,
# coverage stops tracing a route after its first database `await` and
# reports the rest of it as never run.
concurrency = ["greenlet", "thread"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
