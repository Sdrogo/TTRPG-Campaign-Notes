[project]
name = "ex-libris-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.163.1",
    "uvicorn[standard]>=0.54.0",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.3",
    "pyjwt[crypto]>=2.15.1",
    "sqlalchemy[asyncio]>=2.1.8",
    "asyncpg>=0.32.0",
    "alembic>=1.20.1",
    "httpx>=0.27",
    # Signs the requests to the S3 bucket (ticket 73 step 4: Garage).
    "botocore>=1.35",
    "pillow>=13.0.0",
    "python-multipart>=0.0.33",
    # The Room PDF (spec 23b): WeasyPrint renders it (needs Pango, so the
    # deploy is a Docker image, see Dockerfile), Jinja2 writes its HTML and pypdf
    # merges PDF Attachments (`crypto` reads owner-locked ones, AES included).
    "weasyprint>=70",
    "jinja2>=3.1",
    "pypdf[crypto]>=7.1.0",
    # Markdown in Document descriptions and Notes (spec 48): read for the PDF
    # and for plain search excerpts; HTML in the text is never passed through.
    "markdown-it-py>=4.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "pytest-cov>=6.0",
    "mypy>=2.4.1",
    "ruff>=0.17.5",
]

# Installed from uv.lock (with hashes) before our own package is built
# with `--no-build-isolation` (ticket 76). Keep it equal to
# `[build-system].requires`.
[dependency-groups]
# `pip-audit` for the CI audit job, installed from the lock like the rest.
audit = ["pip-audit==2.10.1"]
# `editables`: what hatchling needs for the editable install in CI.
build = ["hatchling==1.33.0", "editables==0.6"]

[tool.mypy]
strict = true
python_version = "3.12"
enable_error_code = ["deprecated"]

# botocore ships no type information.
[[tool.mypy.overrides]]
module = ["botocore", "botocore.*"]
ignore_missing_imports = true

# WeasyPrint ships no type information.
[[tool.mypy.overrides]]
module = ["weasyprint", "weasyprint.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "D1"]
# D1 = every public module, class and function in app/ has a docstring
# (code-standards.md -> Documentation). `__init__` is covered by its class's
# docstring; tests and migrations are named for what they do instead.
ignore = ["D107"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D1"]
"migrations/**" = ["D1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
markers = [
    # Added automatically to any test using the `db_session` fixture
    # (tests/conftest.py). CI runs `-m "not integration"`, which needs no
    # database and therefore no secrets.
    "integration: needs the real Supabase database",
]

[tool.coverage.run]
# SQLAlchemy's asyncio layer runs database calls in greenlets. Without this,
# coverage stops tracing a route after its first database `await` and
# reports the rest of it as never run.
concurrency = ["greenlet", "thread"]

[build-system]
# Pinned, and the same version in the `build` group below so it is in
# uv.lock with its hashes: the image and CI install it from there and build
# without isolation, so no unpinned build tool is fetched (ticket 76).
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
