name: CI

on:
  pull_request:
  push:
    branches: [main]

# A newer push to the same branch makes the running check irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      # Actions are pinned by commit SHA, not by tag: a tag can be moved to
      # point at different code, and CI runs with repository access. The
      # trailing comment is the version that SHA is, so bumps stay readable.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          # Neither job pushes, so don't leave the token behind in
          # .git/config where anything running later could reach it.
          persist-credentials: false

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check and build
        run: npm run build

      # The gate: thresholds live in frontend/vitest.config.ts, so the bar
      # is versioned with the code rather than buried in this workflow.
      - name: Test with coverage
        run: npm run test:coverage

      - name: Summarise coverage
        if: always()
        run: |
          {
            echo '### Frontend coverage'
            echo
            if [ -f coverage/coverage-summary.json ]; then
              node -e "
                const t = require('./coverage/coverage-summary.json').total;
                const row = (k) => \`| \${k} | \${t[k].pct}% | \${t[k].covered}/\${t[k].total} |\`;
                console.log('| Metric | % | Covered |');
                console.log('|---|---|---|');
                for (const k of ['statements', 'branches', 'functions', 'lines']) console.log(row(k));
              "
            else
              echo '_No coverage report produced._'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    # A throwaway Postgres for the database tests, so the whole suite runs
    # here with no Supabase credentials - on fork PRs too. Same major/minor
    # as production (17.6), pinned by digest like the actions above. The
    # Supabase-specific bits the migrations need are recreated by
    # tests/ci/supabase_shim.sql. See "Continuous Integration" in
    # context/architecture.md.
    services:
      postgres:
        image: postgres:17.6@sha256:00bc86618629af00d2937fdc5a5d63db3ff8450acf52f0636ec813c7f4902929
        env:
          # The migrations alter default privileges `FOR ROLE postgres`, as
          # on Supabase, so the tests connect as `postgres` too.
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/postgres
      # Never contacted: tests sign their own tokens and fake Storage
      # (tests/conftest.py).
      SUPABASE_URL: http://supabase.invalid
      SUPABASE_SECRET_KEY: ci-not-a-real-key

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          # The floor this project declares (`requires-python`, and mypy's
          # `python_version`), so CI checks the contract rather than only
          # whatever a developer happens to run.
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Type-check
        run: mypy app tests

      - name: Prepare the database
        env:
          PGPASSWORD: postgres
        run: psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 -f tests/ci/supabase_shim.sql

      # Every migration, from an empty database, on every PR.
      - name: Migrate
        run: alembic upgrade head

      # The whole suite, database tests included (the `integration` marker
      # still lets a developer without a database run `-m "not integration"`).
      # The 95% gate stays on `app/domain`, the home of every invariant;
      # coverage of all of `app/` is reported below.
      - name: Test with coverage
        run: |
          pytest --cov=app --cov-report=term-missing
          coverage report --include='app/domain/*' --fail-under=95

      - name: Summarise coverage
        if: always()
        run: |
          {
            echo '### Backend coverage'
            echo
            echo '```'
            coverage report 2>/dev/null || echo 'No coverage data.'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
