name: CI

on:
  pull_request:
  push:
    branches: [main, staging]

# A newer push to the same branch makes the running check irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      # Actions are pinned by commit SHA, not by tag: a tag can be moved to
      # point at different code, and CI runs with repository access. The
      # trailing comment is the version that SHA is, so bumps stay readable.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          # Neither job pushes, so don't leave the token behind in
          # .git/config where anything running later could reach it.
          persist-credentials: false

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check and build
        run: npm run build

      # The gate: thresholds live in frontend/vitest.config.ts, so the bar
      # is versioned with the code rather than buried in this workflow.
      - name: Test with coverage
        run: npm run test:coverage

      # Vitest's github-actions reporter writes the test counts; this adds
      # the coverage tables underneath.
      - name: Summarise coverage
        if: always()
        run: node ../.github/scripts/frontend-summary.mjs >> "$GITHUB_STEP_SUMMARY"

  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    # A throwaway Postgres for the database tests, so the whole suite runs
    # here with no Supabase credentials - on fork PRs too. Same major/minor
    # as production (17.6), pinned by digest like the actions above. The
    # Supabase-specific bits the migrations need are recreated by
    # tests/ci/supabase_shim.sql. See "Continuous Integration" in
    # context/architecture.md.
    services:
      postgres:
        image: postgres:17.6@sha256:00bc86618629af00d2937fdc5a5d63db3ff8450acf52f0636ec813c7f4902929
        env:
          # The migrations alter default privileges `FOR ROLE postgres`, as
          # on Supabase, so the tests connect as `postgres` too.
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/postgres
      # Never contacted: tests sign their own tokens and fake Storage
      # (tests/conftest.py).
      SUPABASE_URL: http://supabase.invalid
      SUPABASE_SECRET_KEY: ci-not-a-real-key
      # The Room PDF's rendering test (spec 23b) fails, rather than skips,
      # when WeasyPrint can't load Pango, so it can't pass by not running.
      REQUIRE_WEASYPRINT: '1'

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      # What WeasyPrint loads at run time; the same list as backend/Dockerfile.
      - name: System libraries for WeasyPrint
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          # The floor this project declares (`requires-python`, and mypy's
          # `python_version`), so CI checks the contract rather than only
          # whatever a developer happens to run.
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Type-check
        run: mypy app tests

      - name: Prepare the database
        env:
          PGPASSWORD: postgres
        run: psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 -f tests/ci/supabase_shim.sql

      # Every migration, from an empty database, on every PR.
      - name: Migrate
        run: alembic upgrade head

      # The whole suite, database tests included (the `integration` marker
      # still lets a developer without a database run `-m "not integration"`).
      # 100% of `app/`, `app/domain` included: the handful of lines that only
      # ever run against real infrastructure (a real DB engine/session in
      # app/db/session.py, real Storage HTTP calls in app/db/storage.py, no
      # route ever deleting a Room) are marked `# pragma: no cover` instead of
      # counted against the floor - so this is exact, not "just under".
      - name: Test with coverage
        run: |
          pytest --cov=app --cov-report=term-missing --cov-fail-under=100 --junitxml=junit.xml
          coverage report --include='app/domain/*' --fail-under=100

      # Same layout as the Frontend job's summary: test counts, coverage
      # totals, then a collapsible per-file table.
      - name: Summarise tests and coverage
        if: always()
        run: |
          coverage json -q -o coverage.json || true
          python ../.github/scripts/backend-summary.py >> "$GITHUB_STEP_SUMMARY"

  # The backend image (backend/Dockerfile) builds and starts: Render's native
  # runtime can't install Pango, so the service is switched to Docker for the
  # Room PDF (spec 23b). Nothing is pushed anywhere; this only proves the
  # image is good before a service is pointed at it.
  docker:
    name: Backend image
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Build
        run: docker build -t ttrpg-backend backend

      # The app imports (with throwaway settings, like the Backend job) and
      # WeasyPrint renders a PDF from inside the image.
      - name: Smoke test
        run: |
          docker run --rm \
            -e DATABASE_URL=postgresql+asyncpg://u:p@127.0.0.1:5432/db \
            -e SUPABASE_URL=http://supabase.invalid \
            -e SUPABASE_SECRET_KEY=ci-not-a-real-key \
            --entrypoint python ttrpg-backend -c "
          import app.main, weasyprint
          pdf = weasyprint.HTML(string='<p>ok</p>').write_pdf()
          assert pdf.startswith(b'%PDF-'), pdf[:20]
          print('image ok,', len(pdf), 'bytes')
          "

      # The image runs as an unprivileged user, and the smoke test above
      # already rendered a PDF as that user.
      - name: Runs as a non-root user
        run: |
          [ "$(docker run --rm --entrypoint id ttrpg-backend -u)" != "0" ]

      # A secret file must never be baked into the image.
      - name: No env files in the image
        run: |
          docker run --rm --entrypoint sh ttrpg-backend -c '! ls -A /app | grep -E "^\.env"'
