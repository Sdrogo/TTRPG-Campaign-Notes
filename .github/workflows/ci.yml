name: CI

on:
  pull_request:
  push:
    branches: [main, staging]

# A newer push to the same branch makes the running check irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Lint, type-check and build once; the tests run in the shards below.
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      # Actions are pinned by commit SHA, not by tag: a tag can be moved to
      # point at different code, and CI runs with repository access. The
      # trailing comment is the version that SHA is, so bumps stay readable.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Neither job pushes, so don't leave the token behind in
          # .git/config where anything running later could reach it.
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check and build
        run: npm run build

  # The test files split across parallel runners: one runner took ~12 minutes.
  # Each shard writes a blob report with its coverage; `frontend-coverage`
  # merges them, so the 100% gate still applies to the whole suite.
  frontend-tests:
    name: Frontend tests (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      # A shard covers only part of the code, so its thresholds are off here;
      # the merge below checks them on the whole suite.
      - name: Test with coverage
        run: >-
          npx vitest run --coverage --shard=${{ matrix.shard }}/4
          --coverage.thresholds.statements=0 --coverage.thresholds.branches=0
          --coverage.thresholds.functions=0 --coverage.thresholds.lines=0
          --reporter=blob --reporter=github-actions
          --outputFile.blob=.vitest-reports/blob-${{ matrix.shard }}.json

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: vitest-blob-${{ matrix.shard }}
          path: frontend/.vitest-reports/
          include-hidden-files: true
          retention-days: 1

  # The gate: thresholds live in frontend/vitest.config.ts, so the bar
  # is versioned with the code rather than buried in this workflow.
  frontend-coverage:
    name: Frontend coverage
    needs: frontend-tests
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: vitest-blob-*
          path: frontend/.vitest-reports
          merge-multiple: true

      # Fails when a shard failed (its tests are in the blob) or when the
      # merged coverage is under the thresholds.
      - name: Merge the shards and check coverage
        run: npx vitest --merge-reports=.vitest-reports --coverage --reporter=github-actions --reporter=default

      # Vitest's github-actions reporter writes the test counts; this adds
      # the coverage tables underneath.
      - name: Summarise coverage
        if: always()
        run: node ../.github/scripts/frontend-summary.mjs >> "$GITHUB_STEP_SUMMARY"

  # Lint and type-check once; the tests run in the shards below.
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          # The floor this project declares (`requires-python`, and mypy's
          # `python_version`), so CI checks the contract rather than only
          # whatever a developer happens to run.
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/uv.lock

      # uv only exports uv.lock for the install below (ticket 76).
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.11.32'
          enable-cache: false

      # A dependency change in pyproject.toml must come with its uv.lock.
      - name: Lock matches pyproject.toml
        run: uv lock --check

      - name: Install
        run: bash ../.github/scripts/install-backend.sh

      - name: Lint
        run: ruff check .

      - name: Type-check
        run: mypy app tests

  # The test files split across parallel runners, each with its own database:
  # one runner took ~7.5 minutes. Each shard keeps its coverage data;
  # `backend-coverage` combines them, so the 100% gate still applies to the
  # whole suite.
  backend-tests:
    name: Backend tests (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    defaults:
      run:
        working-directory: backend

    # A throwaway Postgres for the database tests, so the whole suite runs
    # here with no credentials - on fork PRs too. Same major/minor as
    # production (17.6), pinned by digest like the actions above. The
    # Supabase-era bits the old migrations need (roles, `auth` tables) are
    # recreated by tests/ci/supabase_shim.sql. See "Continuous Integration" in
    # context/architecture.md.
    services:
      postgres:
        image: postgres:17.6@sha256:00bc86618629af00d2937fdc5a5d63db3ff8450acf52f0636ec813c7f4902929
        env:
          # The migrations alter default privileges `FOR ROLE postgres`, as
          # on Supabase, so the tests connect as `postgres` too.
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/postgres
      # The Room PDF's rendering test (spec 23b) fails, rather than skips,
      # when WeasyPrint can't load Pango, so it can't pass by not running.
      REQUIRE_WEASYPRINT: '1'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # What WeasyPrint loads at run time; the same list as backend/Dockerfile.
      - name: System libraries for WeasyPrint
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/uv.lock

      # uv only exports uv.lock for the install below (ticket 76).
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.11.32'
          enable-cache: false

      - name: Install
        run: bash ../.github/scripts/install-backend.sh

      - name: Prepare the database
        env:
          PGPASSWORD: postgres
        run: psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 -f tests/ci/supabase_shim.sql

      # Every migration, from an empty database, on every PR.
      - name: Migrate
        run: alembic upgrade head

      # The database tests run too (the `integration` marker still lets a
      # developer without a database run `-m "not integration"`). Files are
      # dealt out largest first, round robin, so the shards come out about
      # even; every file lands in exactly one shard.
      - name: Test with coverage
        env:
          SHARD: ${{ matrix.shard }}
          COVERAGE_FILE: .coverage.shard${{ matrix.shard }}
        run: |
          files=$(ls -S tests/test_*.py | awk -v n=4 -v i="$SHARD" 'NR % n == i % n')
          # shellcheck disable=SC2086
          pytest $files --cov=app --cov-report= --junitxml=junit-$SHARD.xml

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: backend-coverage-${{ matrix.shard }}
          path: |
            backend/.coverage.shard${{ matrix.shard }}
            backend/junit-${{ matrix.shard }}.xml
          include-hidden-files: true
          retention-days: 1

  # The gate: 100% of `app/`, `app/domain` included. The handful of lines that
  # only ever run against real infrastructure (a real DB engine/session in
  # app/db/session.py, real Storage HTTP calls, no route ever deleting a
  # Room) are marked `# pragma: no cover` instead of counted against the
  # floor - so this is exact, not "just under". A missing shard leaves lines
  # uncovered, so it fails here too.
  backend-coverage:
    name: Backend coverage
    needs: backend-tests
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/uv.lock

      # uv only exports uv.lock for the install below (ticket 76).
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.11.32'
          enable-cache: false

      # The locked dev tools, coverage among them (each checked against its
      # hash), not our package: coverage reads its settings from
      # pyproject.toml and the sources from the checkout.
      - name: Install
        run: |
          uv export --frozen --extra dev --no-emit-project --quiet --output-file /tmp/dev.txt
          pip install --require-hashes -r /tmp/dev.txt

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: backend-coverage-*
          path: backend
          merge-multiple: true

      - name: Check coverage
        run: |
          coverage combine
          coverage report --show-missing --fail-under=100
          coverage report --include='app/domain/*' --fail-under=100

      # A shard's failed test fails its own job; this makes the run fail here
      # too, so this one check carries the whole gate.
      - name: Every shard passed
        env:
          RESULTS: ${{ needs.backend-tests.result }}
        run: test "$RESULTS" = success

      # Same layout as the Frontend summary: test counts, coverage totals,
      # then a collapsible per-file table.
      - name: Summarise tests and coverage
        if: always()
        run: |
          coverage json -q -o coverage.json || true
          python ../.github/scripts/backend-summary.py >> "$GITHUB_STEP_SUMMARY"

  # The backend image (backend/Dockerfile) builds and starts: Render's native
  # runtime can't install Pango, so the Room PDF (spec 23b) needs a Docker
  # service (staging runs one). Nothing is pushed anywhere; this only proves
  # the image is good before a service is pointed at it.
  docker:
    name: Backend image
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build
        run: docker build -t ttrpg-backend backend

      # The app imports (with throwaway settings, like the Backend job) and
      # WeasyPrint renders a PDF from inside the image.
      - name: Smoke test
        run: |
          docker run --rm \
            -e DATABASE_URL=postgresql+asyncpg://u:p@127.0.0.1:5432/db \
            --entrypoint python ttrpg-backend -c "
          import app.main, weasyprint
          pdf = weasyprint.HTML(string='<p>ok</p>').write_pdf()
          assert pdf.startswith(b'%PDF-'), pdf[:20]
          print('image ok,', len(pdf), 'bytes')
          "

      # The installed package carries the Room PDF's templates, stylesheets and
      # fonts (spec 23b_1b): each style renders a small manual from inside the
      # image, as the unprivileged user, and its text is read back (without the
      # first letter: Gothic sets it as a large initial, a separate piece of text).
      - name: Room PDF styles render
        run: |
          docker run --rm \
            -e DATABASE_URL=postgresql+asyncpg://u:p@127.0.0.1:5432/db \
            --entrypoint python ttrpg-backend -c "
          import datetime, io, uuid
          from pypdf import PdfReader
          from app.domain.manual import Block, Manual, ManualChapter, ManualDocument, Run
          from app.pdf.labels import manual_labels
          from app.pdf.render import ManualStyle, PageSize, render_manual_pdf
          doc = ManualDocument(uuid.uuid4(), 'Castle', None, [Block('p', (Run('Città dell Ovest'),))], [], [])
          chapter = ManualChapter('chapter-1', 'Places', [doc])
          manual = Manual('Barovia', None, datetime.date.today(), None, manual_labels('en'), [chapter], [])
          for style in ManualStyle:
              reader = PdfReader(io.BytesIO(render_manual_pdf(manual, style, PageSize.A4)))
              text = ' '.join(page.extract_text() for page in reader.pages)
              assert len(reader.pages) == 3 and 'ittà dell Ovest' in text, (style, len(reader.pages))
              print(style.value, 'ok')
          "

      # The image runs as an unprivileged user, and the smoke test above
      # already rendered a PDF as that user.
      - name: Runs as a non-root user
        run: |
          [ "$(docker run --rm --entrypoint id ttrpg-backend -u)" != "0" ]

      # A secret file must never be baked into the image.
      - name: No env files in the image
        run: |
          docker run --rm --entrypoint sh ttrpg-backend -c '! ls -A /app | grep -E "^\.env"'

  # Spec 72 Decisions 13-14: a known vulnerable dependency fails the build,
  # like the other gates, and the production Caddyfile must parse before the
  # VPS deploy ever copies it. A finding with no fix released yet can be
  # ignored by id here (`--ignore-vuln` / an npm override), with a comment
  # saying why and until when.
  security:
    name: Security checks
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      # The backend's runtime dependencies exactly as the image installs them:
      # uv.lock exported with its hashes (ticket 76), audited without
      # installing anything.
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.11.32'
          enable-cache: false

      - name: Backend dependency audit
        working-directory: backend
        run: |
          uv export --frozen --no-dev --no-emit-project --quiet --output-file /tmp/requirements.txt
          # pip-audit itself from the lock too (group `audit`), with hashes.
          uv export --frozen --only-group audit --no-emit-project --quiet --output-file /tmp/audit-tool.txt
          python -m venv /tmp/audit
          /tmp/audit/bin/pip install --quiet --require-hashes -r /tmp/audit-tool.txt
          # PyPI's advisory API is sometimes slow from the runners (2026-11-18:
          # three failures in a row on the default 15 s read timeout), so
          # allow 60 s and one more try before failing the check.
          audit() {
            /tmp/audit/bin/pip-audit -r /tmp/requirements.txt --require-hashes --disable-pip \
              --progress-spinner off --timeout 60
          }
          audit || { echo "pip-audit failed, trying once more in 30 s"; sleep 30; audit; }

      # What ships to the browser only; dev tooling never reaches users.
      - name: Frontend dependency audit
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high

      - name: Caddyfile is valid
        run: |
          docker run --rm -e API_HOSTS=api.example.com \
            -e FRONTEND_HOSTS="example.com" \
            -e FRONTEND_REDIRECT_HOSTS="www.example.com" \
            -e CSP_CONNECT_SRC="https://api.example.com" \
            -e FILES_HOSTS="https://files.example.com" \
            -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2.11@sha256:4851e54a46b206517c574821bb5cc67f170d2156041e9fbc4c9193b45e84a75b caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile

      # The scripts the deploy copies to the servers (shellcheck comes with
      # the runner image). deploy.sh lists its own release folders with `ls`,
      # whose names it makes itself (SC2010, SC2012).
      - name: Deploy scripts pass shellcheck
        run: shellcheck -e SC2010,SC2012 deploy/*.sh
