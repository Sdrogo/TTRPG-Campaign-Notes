name: Claude Code Review

# Automatic code review by Claude on every pull request into `staging`
# (context/code-standards.md -> Branches and Pull Requests). Replaces
# CodeRabbit, whose auto-review was scoped the same way.
on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    branches: [staging]

# A newer push to the same PR makes the running review stale.
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    name: Review
    # Drafts are reviewed once they are marked ready, like CodeRabbit did.
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
      issues: read

    steps:
      # Pinned by commit SHA, as in ci.yml; the comment is the version.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: anthropics/claude-code-action@97c53473391bff1901034d4b454b5bac7ab7a029 # v1.0.239
        with:
          # Set exactly one of these two repository secrets: an OAuth token
          # from `claude setup-token` (Claude Pro/Max subscription) or an
          # Anthropic Console API key (billed per use).
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # Comment with this job's own token instead of the Claude GitHub
          # App's. The App token is only issued when this file matches the
          # copy on the default branch (`main`), which a PR into `staging`
          # never does until the next release, so the review would be skipped.
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}
            BASE: ${{ github.event.pull_request.base.ref }}

            Review this pull request. The base branch is checked out in the
            working directory; read the change with `gh pr diff` and
            `gh pr view`, and open files in the working directory for
            surrounding context.

            Judge the change against the project's own rules, which
            CLAUDE.md points to: context/code-standards.md,
            context/architecture.md (boundaries and invariants),
            context/ui-context.md (frontend), context/ai-workflow-rules.md.
            Spec IDs (FR-, UC-, VR-, I-) are defined in
            context/requirements.md. That file is protected: flag any change
            to it as needing the product owner's explicit approval.

            Look for, in order of importance:
            1. Bugs and broken behavior, including edge cases and error paths.
            2. Security: authorization on Room-scoped data, input validation,
               secrets, injection.
            3. Violations of the architecture invariants or code standards
               (missing docstrings/JSDoc, `any` in TypeScript, untranslated
               UI strings, missing tests for new behavior).
            4. Docs out of sync: a change to behavior, architecture or scope
               that doesn't update the matching context/ file, and
               context/progress-tracker.md not updated for a meaningful change.

            How to report:
            - Put each concrete finding on its line with
              mcp__github_inline_comment__create_inline_comment (confirmed=true),
              saying what goes wrong and the fix. Use a suggestion block when
              the fix is a few lines.
            - Then post one short summary with `gh pr comment`: what the PR
              does, the findings by severity, and anything you couldn't verify.
              If nothing is wrong, say so in one line.
            - Skip style nits that a linter or formatter already enforces, and
              don't praise.
            - This workflow runs again on every push. Read the earlier review
              comments first (`gh pr view --comments`) and don't repeat a
              finding that is already posted and still unaddressed.
            - Write in English, like the rest of the repository.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
