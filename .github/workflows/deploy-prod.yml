name: Deploy production

# `main` → the production VPS (ticket 73: frontend and API, Strasbourg). The
# work is in deploy-vps.yml; what it needs is listed there, in the
# `vps-production` environment (not `production`, which Vercel's own GitHub
# deployments used). Runs after CI passes on a push to `main`, or by hand
# (Actions → Run workflow) to deploy or roll back to any commit. Off until
# the repository variable VPS_DEPLOY_ENABLED is `true`.
#
# Both triggers only work from the default branch.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: Commit SHA or branch to deploy (default main)
        required: false

# One deploy at a time, and never cancel one halfway.
concurrency:
  group: deploy-prod
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    if: >-
      vars.VPS_DEPLOY_ENABLED == 'true' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push'))
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/deploy-vps.yml
    with:
      environment: vps-production
      ref: ${{ github.event.workflow_run.head_sha || inputs.ref || 'main' }}
      tag_alias: prod
    secrets: inherit
